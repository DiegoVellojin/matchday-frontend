name: matchday_app
description: "MatchDay - Plataforma de gestión y competición de fútbol."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Diseño ---
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.2.4

  # --- Navegación & Estado ---
  go_router: ^17.2.2
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^3.3.1 # Mantengo ambas por compatibilidad de tus módulos
  get_it: ^9.2.1

  # --- Networking & Backend ---
  dio: ^5.9.2
  fpdart: ^1.2.0
  firebase_core: ^4.7.0
  firebase_storage: ^13.3.0
  google_sign_in: ^7.2.0

  # --- Utilidades & Mapas ---
  google_maps_flutter: ^2.17.0
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Registro de Assets Vectoriales e Imágenes
  assets:
    - assets/icons/
    # Al declarar la carpeta con '/', registras todos los archivos dentro automáticamente

  # Configuración de Fuentes (puedes activarla si añades .ttf en el futuro)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700