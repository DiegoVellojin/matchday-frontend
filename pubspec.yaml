name: matchday_app
description: "MatchDay - Plataforma de gestión y competición de fútbol."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Diseño ---
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.2.4
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  animations: ^2.0.11

  # --- Navegación & Estado ---
  go_router: ^17.2.2
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^3.3.1 
  get_it: ^9.2.1

  # --- Networking & Backend ---
  dio: ^5.9.2
  fpdart: ^1.2.0
  firebase_core: ^4.7.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0
  google_sign_in: ^7.2.0

  app_links: ^6.4.0
  flutter_secure_storage: ^9.2.2

  # --- Utilidades & Mapas ---
  google_maps_flutter: ^2.17.0
  flutter_image_compress: ^2.4.0
  image_picker: ^1.2.1
  share_plus: ^12.0.2
  intl_phone_field: ^3.2.0
  url_launcher: ^6.3.2
  equatable: ^2.0.8
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  lottie: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#151515"
  adaptive_icon_foreground: "assets/icons/app_icon.png"